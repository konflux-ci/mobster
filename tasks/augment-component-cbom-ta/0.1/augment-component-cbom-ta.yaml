---
apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: augment-component-cbom-ta
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: sbom

spec:
  description: >-
    Update component-level CBOM with release-time information, upload
    them to TPA or fall back to pushing them to S3.

    Callers must configure either attestationPubKey or complete keyless
    verification settings. Leaving both unset causes failure.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
      default: "empty"

    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"

    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""

    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""

    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""

    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release

    - name: taskGitUrl
      type: string
      description: The url to the git repo where the trusted artifact stepactions to be used are stored

    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used for trusted artifact stepactions

    - name: snapshotSpec
      type: string
      description: Path to the mapped snapshot spec.

    - name: atlasSecretName
      type: string
      description: >
        The name of the K8s secret containing the 'sso_account' and 'sso_token'
        keys used for Atlas OIDC authentication.

    - name: retryAWSSecretName
      type: string
      description: >
        The name of the K8s secret containing the 'atlas-aws-access-key-id' and
        'atlas-aws-secret-access-key' keys used for AWS S3 access.

    - name: retryS3Bucket
      type: string
      default: ""
      description: >
        The name of the S3 bucket used to store data for the retry mechanism.

    - name: atlasApiUrl
      type: string
      description: URL of the Atlas API host.

    - name: ssoTokenUrl
      description: URL of the Atlas SSO token issuer.
      type: string

    - name: caPath
      description: Path to the certificate authority bundle to set up TPA requests.
      default: ""
      type: string

    - name: augmentConcurrency
      description: |
        Maximum number of SBOMs that will be augmented concurrently. Higher
        limit will speed up execution for larger snapshots, but will have
        higher memory requirements.
      default: "8"
      type: string

    - name: uploadConcurrency
      description: |
        Maximum number of SBOMs that will be uploaded to Atlas concurrently.
        Higher limit will speed up execution for larger snapshots, but will
        have higher memory requirements.
      default: "8"
      type: string

    - name: resultsDirPath
      type: string
      description: Path to directory in the dataDir to store JSON task results to.

    - name: attestationPubKey
      type: string
      description: K8s reference to a secret containing a key for verifying provenance attestations
      default: ""

    - name: releaseData
      type: string
      description: Path to the merged data file from collect-data in the dataDir.

    # Configuration parameters for keyless verification, if enabled.
    - name: defaultOIDCIssuer
      type: string
      description: Expected OIDC issuer URL for verifying build-time provenance attestations.
      default: ""
    - name: rekorExternalUrl
      type: string
      description: The external URL of the Rekor transparency log.
      default: ""
    - name: rekorInternalUrl
      type: string
      description: The internal URL of the Rekor transparency log.
      default: ""
    - name: fulcioExternalUrl
      type: string
      description: The external URL of the Fulcio certificate authority.
      default: ""
    - name: fulcioInternalUrl
      type: string
      description: The internal URL of the Fulcio certificate authority.
      default: ""
    - name: tufExternalUrl
      type: string
      description: The external URL of the TUF repository.
      default: ""
    - name: tufInternalUrl
      type: string
      description: The internal URL of the TUF repository.
      default: ""
    - name: buildIdentityRegexp
      type: string
      description: |
        A regular expression to verify keyless-attested build-time artifacts, if applicable.
      default: ""

    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: caCertPath
      type: string
      description: Path to CA certificate bundle for TLS verification with self-signed certificates
      default: /mnt/trusted-ca/ca-bundle.crt

  results:
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string

  volumes:
    - name: workdir
      emptyDir: {}
    - name: oidc-token
      projected:
        sources:
          - serviceAccountToken:
              audience: sigstore
              # 30 minutes should be enough to finish this task
              expirationSeconds: 1800
              path: oidc-token
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true

  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"

  steps:
    - name: use-trusted-artifact
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)

    - name: process-component-cboms
      # image supporting this command does not exist yet
      image: quay.io/konflux-ci/mobster@sha256:PLACEHOLDER
      env:
        - name: MOBSTER_TPA_SSO_ACCOUNT
          valueFrom:
            secretKeyRef:
              name: $(params.atlasSecretName)
              key: sso_account
              optional: false
        - name: MOBSTER_TPA_SSO_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.atlasSecretName)
              key: sso_token
              optional: false
        - name: MOBSTER_TPA_SSO_TOKEN_URL
          value: $(params.ssoTokenUrl)
        - name: MOBSTER_TPA_CA_INFO
          value: $(params.caPath)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: $(params.retryAWSSecretName)
              key: atlas-aws-access-key-id
              optional: false
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.retryAWSSecretName)
              key: atlas-aws-secret-access-key
              optional: false
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"

      volumeMounts:
        - mountPath: /var/run/sigstore/cosign
          name: oidc-token

      computeResources:
        limits:
          memory: 2Gi
        requests:
          memory: 2Gi
          cpu: 350m
      script: |
        #!/usr/bin/env bash
        set -eux

        ca_bundle=/mnt/trusted-ca/ca-bundle.crt
        system_bundle=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        if [ -f "$ca_bundle" ]; then
          echo "[$(date --utc -Ins)] Using mounted CA bundle: $ca_bundle"
          cat "$ca_bundle" >> "$system_bundle"
        fi

        # This is a little fragile, ideally it would be just a param. It's here
        # for consistency with other tasks in release-service-catalog. The
        # script below will verify that the release_id has the correct format.
        release_id=$(dirname "$(params.snapshotSpec)")

        mobster_args=(
          --data-dir "$(params.dataDir)"
          --snapshot-spec "$(params.snapshotSpec)"
          --atlas-api-url "$(params.atlasApiUrl)"
          --release-id "$release_id"
          --augment-concurrency "$(params.augmentConcurrency)"
          --upload-concurrency "$(params.uploadConcurrency)"
          --result-dir "$(params.resultsDirPath)"
          --release-data "$(params.releaseData)"
        )

        # Initialize URL parameters to the right value (prioritizing internal url)
        rekorUrl="$(params.rekorInternalUrl)"; rekorUrl="${rekorUrl:-$(params.rekorExternalUrl)}"
        fulcioUrl="$(params.fulcioInternalUrl)"; fulcioUrl="${fulcioUrl:-$(params.fulcioExternalUrl)}"
        tufUrl="$(params.tufInternalUrl)"; tufUrl="${tufUrl:-$(params.tufExternalUrl)}"

        # Params are basically Bash commands, their value
        # has to be checked with -n. Env variables should
        # be checked with -v to not leak expanded secrets
        # through xtrace. Bash conditionals ([[) have to
        # be used instead of Shell conditionals ([) to use -v
        if [[ -n "$(params.defaultOIDCIssuer)" \
          && -n "${rekorUrl}" \
          && -n "${fulcioUrl}" \
          && -n "${tufUrl}" \
          && -n "$(params.buildIdentityRegexp)" \
        ]]; then
          # Keyless verification is used
          cosign initialize --root "${tufUrl}/root.json" \
            --mirror "${tufUrl}"
          mobster_args+=(
            --fulcio-url "${fulcioUrl}"
            --oidc-issuer "$(params.defaultOIDCIssuer)"
            --oidc-identity-pattern "$(params.buildIdentityRegexp)"
            --rekor-url "${rekorUrl}"
          )
        elif [[ -n "$(params.attestationPubKey)" ]]; then
          # Static key verification is used for augmentation
          mobster_args+=(
            --verify-key "$(params.attestationPubKey)"
          )
        fi
        if [[ -n "$(params.retryS3Bucket)" ]]; then
          mobster_args+=(
            --retry-s3-bucket "$(params.retryS3Bucket)"
          )
        fi
        process_component_cbom "${mobster_args[@]}"

    - name: create-trusted-artifact
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
        - name: caCertPath
          value: $(params.caCertPath)
