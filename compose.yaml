---
services:
  zot:
    image: ghcr.io/project-zot/zot:latest
    ports:
      - "9000:9000"
    volumes:
      - ./hack/tests/zot.config.json:/etc/zot/config.json:ro,Z
    command: ["serve", "/etc/zot/config.json"]

  tpa:
    build:
      context: .
      dockerfile: hack/tests/Containerfile.tpa
    ports:
      - "8080:8080"

  garage:
    image: dxflrs/garage:v2.3.0
    ports:
      - "9900:9900"  # S3 API
      - "9901:9901"  # Admin / health
    volumes:
      - ./hack/tests/garage.toml:/etc/garage.toml:ro,Z
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      # Access key must be GK + 24 hex chars (26 total). Secret is 64 hex chars.
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      GARAGE_DEFAULT_BUCKET: sboms
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket

volumes:
  garage-meta:
  garage-data:
